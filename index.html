<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Nouvel onglet</title>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('[SW] Enregistré:', reg.scope))
                    .catch(err => console.warn('[SW] Echec (normal en file://):', err));
            });
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#07a968',
                        'primary-light': '#0fcf80',
                        'primary-dark': '#058a55',
                        'primary-glow': 'rgba(7, 169, 104, 0.3)',
                        background: '#0a0f0d',
                        surface: '#0d1411',
                        'surface-container-low': '#0f1713',
                        'surface-container': '#121c17',
                        'surface-container-highest': '#1a2620',
                        'surface-bright': '#1f2e26',
                        'on-surface': '#e8f5f0',
                        'on-surface-variant': '#a8c4b8',
                        'outline-variant': '#2d4a3d',
                        'accent-dark': '#1a6042'
                    },
                    fontFamily: {
                        headline: ['Space Grotesk', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                        label: ['Manrope', 'sans-serif']
                    },
                    boxShadow: {
                        'primary-glow': '0 0 30px rgba(7, 169, 104, 0.25)',
                        'primary-strong': '0 0 20px rgba(7, 169, 104, 0.4)'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Manrope:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <script>
        const DEFAULT_LOCATION = { city: 'Douala', country: 'CM', lat: 4.0511, lon: 9.7679 };
        let userLocation = { ...DEFAULT_LOCATION };

        /* ─── Cache coordonnées ─────────────────────────────────────────── */
        function loadCachedLocation() {
            try {
                const c = localStorage.getItem('pyramid_location');
                if (!c) return false;
                const { lat, lon, timestamp } = JSON.parse(c);
                if (Date.now() - timestamp < 86400000) {
                    userLocation = { ...DEFAULT_LOCATION, lat, lon };
                    return true;
                }
                return false;
            } catch { return false; }
        }
        function saveCachedLocation(lat, lon) {
            localStorage.setItem('pyramid_location', JSON.stringify({ lat, lon, timestamp: Date.now() }));
        }

        /* ─── Géolocalisation ───────────────────────────────────────────── */
        function getUserLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(DEFAULT_LOCATION); return; }
                navigator.geolocation.getCurrentPosition(
                    ({ coords: { latitude: lat, longitude: lon } }) => {
                        saveCachedLocation(lat, lon);
                        resolve({ ...DEFAULT_LOCATION, lat, lon });
                    },
                    () => resolve(DEFAULT_LOCATION),
                    { enableHighAccuracy: false, timeout: 5000, maximumAge: 300000 }
                );
            });
        }

        /* ─── Géocodage inverse (Nominatim) ─────────────────────────────── */
        async function reverseGeocode(lat, lon) {
            try {
                const c = localStorage.getItem('pyramid_location_name');
                if (c) {
                    const { city, country, timestamp } = JSON.parse(c);
                    if (Date.now() - timestamp < 86400000) return { city, country };
                }
            } catch {}
            try {
                const res = await fetch(
                    `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=fr`,
                    { headers: { 'User-Agent': 'PyramidNewTab/1.0' } }
                );
                const data = await res.json();
                const a = data.address || {};
                const city    = a.city || a.town || a.village || a.municipality || a.county || DEFAULT_LOCATION.city;
                const country = a.country || 'Cameroun';
                localStorage.setItem('pyramid_location_name', JSON.stringify({ city, country, timestamp: Date.now() }));
                return { city, country };
            } catch {
                try {
                    const c = localStorage.getItem('pyramid_location_name');
                    if (c) { const { city, country } = JSON.parse(c); return { city, country }; }
                } catch {}
                return { city: DEFAULT_LOCATION.city, country: 'Cameroun' };
            }
        }

        function updateLocationDisplay(city, country) {
            const el = document.getElementById('location-display');
            if (el) el.textContent = `${city}, ${country}`;
        }

        /* ─── Horloge ───────────────────────────────────────────────────── */
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
            const days   = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
            const months = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
            document.getElementById('date').textContent = `${days[now.getDay()]} ${now.getDate()} ${months[now.getMonth()]}`;
        }

        /* ─── Descriptions WMO complètes en français ────────────────────── */
        const WMO_DATA = {
            0:  { desc: 'Ciel dégagé',           icon: 'fa-sun',                 color: '#FFD700' },
            1:  { desc: 'Peu nuageux',            icon: 'fa-cloud-sun',           color: '#FFC107' },
            2:  { desc: 'Partiellement nuageux',  icon: 'fa-cloud-sun',           color: '#F0A500' },
            3:  { desc: 'Couvert',                icon: 'fa-cloud',               color: '#a8c4b8' },
            45: { desc: 'Brouillard',             icon: 'fa-smog',                color: '#c8b89a' },
            48: { desc: 'Brouillard givrant',     icon: 'fa-smog',                color: '#b8a888' },
            51: { desc: 'Bruine légère',          icon: 'fa-cloud-rain',          color: '#90cce0' },
            53: { desc: 'Bruine modérée',         icon: 'fa-cloud-rain',          color: '#60b0d0' },
            55: { desc: 'Bruine dense',           icon: 'fa-cloud-rain',          color: '#3a98c0' },
            56: { desc: 'Bruine verglaçante',     icon: 'fa-cloud-rain',          color: '#60b0d0' },
            57: { desc: 'Bruine verglaçante forte',icon: 'fa-cloud-rain',         color: '#3a98c0' },
            61: { desc: 'Pluie légère',           icon: 'fa-cloud-rain',          color: '#7ec8e3' },
            63: { desc: 'Pluie modérée',          icon: 'fa-cloud-showers-heavy', color: '#4aa8c8' },
            65: { desc: 'Pluie forte',            icon: 'fa-cloud-showers-heavy', color: '#1a88a8' },
            66: { desc: 'Pluie verglaçante',      icon: 'fa-cloud-rain',          color: '#4aa8c8' },
            67: { desc: 'Pluie verglaçante forte',icon: 'fa-cloud-showers-heavy', color: '#1a88a8' },
            71: { desc: 'Neige légère',           icon: 'fa-snowflake',           color: '#cce8ff' },
            73: { desc: 'Neige modérée',          icon: 'fa-snowflake',           color: '#b0d8ff' },
            75: { desc: 'Neige forte',            icon: 'fa-snowflake',           color: '#90c8ff' },
            77: { desc: 'Grains de neige',        icon: 'fa-snowflake',           color: '#80b8f0' },
            80: { desc: 'Averses légères',        icon: 'fa-cloud-rain',          color: '#7ec8e3' },
            81: { desc: 'Averses modérées',       icon: 'fa-cloud-showers-heavy', color: '#3a98c0' },
            82: { desc: 'Averses violentes',      icon: 'fa-cloud-showers-heavy', color: '#0a6888' },
            85: { desc: 'Averses de neige',       icon: 'fa-snowflake',           color: '#b0d8ff' },
            86: { desc: 'Averses de neige forte', icon: 'fa-snowflake',           color: '#90c8ff' },
            95: { desc: 'Orage',                  icon: 'fa-cloud-bolt',          color: '#FFD700' },
            96: { desc: 'Orage avec grêle',       icon: 'fa-cloud-bolt',          color: '#FFC107' },
            99: { desc: 'Orage violent',          icon: 'fa-cloud-bolt',          color: '#FF8C00' },
        };
        const WMO_FALLBACK = { desc: 'Nuageux', icon: 'fa-cloud', color: '#a8c4b8' };

        function getWMO(code) {
            return WMO_DATA[code] || WMO_FALLBACK;
        }

        /* ─── Applique les données météo au widget ──────────────────────── */
        function applyWeather(temp, feel, hum, wind, code) {
            const wmo = getWMO(code);
            // Température
            document.getElementById('temperature').textContent = `${Math.round(temp)}°C`;
            // Icône
            const iconEl = document.getElementById('weather-icon');
            if (iconEl) iconEl.innerHTML = `<i class="fas ${wmo.icon}" style="color:#ffffff"></i>`;
            // Description
            const descEl = document.getElementById('weather-desc');
            if (descEl) descEl.textContent = wmo.desc;
            // Méta : humidité, vent, ressenti
            const metaEl = document.getElementById('weather-meta');
            if (metaEl) {
                metaEl.innerHTML = `
                    <span><i class="fas fa-droplet" style="font-size:7px"></i> ${Math.round(hum)}%</span>
                    <span><i class="fas fa-wind" style="font-size:7px"></i> ${Math.round(wind)} km/h</span>
                    <span><i class="fas fa-thermometer-half" style="font-size:7px"></i> ${Math.round(feel)}°</span>
                `;
            }
        }

        /* ─── Cache météo (10 min) ──────────────────────────────────────── */
        function loadCachedWeather() {
            try {
                const c = localStorage.getItem('pyramid_weather');
                if (!c) return false;
                const { temp, feel, hum, wind, code, timestamp } = JSON.parse(c);
                if (Date.now() - timestamp < 600000) {
                    applyWeather(temp, feel ?? temp, hum ?? 0, wind ?? 0, code ?? 0);
                    return true;
                }
                return false;
            } catch { return false; }
        }

        /* ─── Fetch météo Open-Meteo (données complètes) ────────────────── */
        async function fetchWeather() {
            loadCachedWeather();
            try {
                const res = await fetch(
                    `https://api.open-meteo.com/v1/forecast` +
                    `?latitude=${userLocation.lat}&longitude=${userLocation.lon}` +
                    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code` +
                    `&wind_speed_unit=kmh&timezone=auto`
                );
                const data = await res.json();
                const c = data.current;
                const temp = c.temperature_2m;
                const feel = c.apparent_temperature;
                const hum  = c.relative_humidity_2m;
                const wind = c.wind_speed_10m;
                const code = c.weather_code;
                applyWeather(temp, feel, hum, wind, code);
                localStorage.setItem('pyramid_weather', JSON.stringify({
                    temp, feel, hum, wind, code, timestamp: Date.now()
                }));
            } catch {
                console.warn('[Météo] Hors-ligne — affichage du cache');
                if (!loadCachedWeather()) {
                    document.getElementById('temperature').textContent = '--°C';
                    const el = document.getElementById('weather-icon');
                    if (el) el.innerHTML = '<i class="fas fa-cloud-slash" style="color:#ffffff"></i>';
                    const d = document.getElementById('weather-desc');
                    if (d) d.textContent = 'Indisponible';
                }
            }
        }

        document.addEventListener('DOMContentLoaded', function () {

            /* ── Thèmes ─────────────────────────────────────────────────── */
            const bgImage    = document.getElementById('bgImage');
            const customBtn  = document.getElementById('customBtn');
            const themePanel = document.getElementById('themePanel');
            const closePanel = document.getElementById('closePanel');
            const items = document.querySelectorAll('.theme-item');
            let isOpen = false;

            function applySolidBackground() {
                const sb = document.getElementById('solidBg');
                bgImage.style.opacity = '0';
                sb.style.background = 'linear-gradient(135deg, #0a0f0d 0%, #121c17 100%)';
                sb.querySelector('div').style.background = 'rgba(7,169,104,0.20)';
                sb.style.opacity = '1';
            }
            customBtn.addEventListener('click', e => { e.stopPropagation(); isOpen = !isOpen; themePanel.style.transform = isOpen ? 'translateY(0)' : 'translateY(100%)'; });
            closePanel.addEventListener('click', () => { isOpen = false; themePanel.style.transform = 'translateY(100%)'; });
            document.addEventListener('click', e => { if (isOpen && !themePanel.contains(e.target) && !customBtn.contains(e.target)) { isOpen = false; themePanel.style.transform = 'translateY(100%)'; } });

            const savedTheme = localStorage.getItem('selectedTheme');
            const solidBg    = document.getElementById('solidBg');
            if (!savedTheme) { applySolidBackground(); document.querySelector('.theme-item[data-bg="none"]')?.classList.add('active'); }
            else if (savedTheme === 'none') { applySolidBackground(); }
            else { solidBg.style.opacity = '0'; bgImage.src = savedTheme; bgImage.style.opacity = '0.6'; }

            items.forEach(item => {
                const bg = item.getAttribute('data-bg');
                if (bg === savedTheme) item.classList.add('active');
                item.addEventListener('click', () => {
                    items.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    if (bg === 'none') { applySolidBackground(); localStorage.setItem('selectedTheme', 'none'); }
                    else {
                        solidBg.style.opacity = '0';
                        bgImage.style.opacity = '0'; bgImage.style.transform = 'scale(1.05)';
                        setTimeout(() => { bgImage.src = bg; bgImage.style.opacity = '0.6'; bgImage.style.transform = 'scale(1)'; }, 200);
                        localStorage.setItem('selectedTheme', bg);
                    }
                });
            });

            document.body.classList.add('loaded');
            updateClock();

            /* ── Init localisation + météo ──────────────────────────────── */
            (async function initLocationAndWeather() {
                try {
                    const c = localStorage.getItem('pyramid_location_name');
                    if (c) { const { city, country } = JSON.parse(c); updateLocationDisplay(city, country); }
                } catch {}

                if (!loadCachedLocation()) {
                    const loc = await getUserLocation();
                    userLocation = loc;
                }

                fetchWeather();
                reverseGeocode(userLocation.lat, userLocation.lon)
                    .then(({ city, country }) => updateLocationDisplay(city, country));
            })();

            setInterval(updateClock, 1000);
            setInterval(fetchWeather, 600000);

            /* ── Carousel infini avec flèches ───────────────────────────── */
            (function () {
                const track = document.getElementById('carousel-track');
                const vp    = document.getElementById('carousel-viewport');
                if (!track || !vp) return;

                // Récupère les items originaux
                const originals  = Array.from(track.querySelectorAll('.carousel-item'));
                const ORIG_COUNT = originals.length;
                if (ORIG_COUNT === 0) return;

                // Triple clonage : [clone avant] [originaux] [clone après]
                originals.forEach(el => {
                    const before = el.cloneNode(true); before.setAttribute('aria-hidden', 'true');
                    track.insertBefore(before, track.firstChild);
                });
                originals.forEach(el => {
                    const after = el.cloneNode(true); after.setAttribute('aria-hidden', 'true');
                    track.appendChild(after);
                });

                const GAP    = 18; // doit correspondre au gap CSS
                const ITEM_W = () => {
                    const first = track.querySelector('.carousel-item');
                    return first ? first.offsetWidth + GAP : 62;
                };
                const CLONE_W = () => ORIG_COUNT * ITEM_W();

                let pos     = 0;
                let speed   = 0.55;   // px / frame auto-scroll
                let isAuto  = true;
                let isDrag  = false;
                let dragSX  = 0, dragSPos = 0;
                let didDrag = false;

                function setPos(instant) {
                    if (instant) {
                        track.style.transition = 'none';
                        track.style.transform  = `translateX(${pos}px)`;
                        // Laisse le navigateur appliquer, puis réactive les transitions
                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            track.style.transition = '';
                        }));
                    } else {
                        track.style.transform = `translateX(${pos}px)`;
                    }
                }

                function reflow() {
                    const cw = CLONE_W();
                    if (pos <= -cw * 2) { pos += cw; setPos(true); }
                    if (pos >= 0)        { pos -= cw; setPos(true); }
                }

                function init() {
                    pos = -CLONE_W(); // démarre sur la série du milieu
                    setPos(true);
                }

                function loop() {
                    if (isAuto && !isDrag) {
                        pos -= speed;
                        reflow();
                        track.style.transform = `translateX(${pos}px)`;
                    }
                    requestAnimationFrame(loop);
                }

                function stepBy(n) {
                    isAuto = false;
                    clearTimeout(window._carouselResumeTimer);
                    pos -= n * ITEM_W();
                    reflow();
                    track.style.transition = 'transform .38s cubic-bezier(.25,.46,.45,.94)';
                    track.style.transform  = `translateX(${pos}px)`;
                    setTimeout(() => { track.style.transition = ''; }, 400);
                    window._carouselResumeTimer = setTimeout(() => { isAuto = true; }, 2500);
                }

                document.getElementById('carousel-prev').addEventListener('click', () => stepBy(-1));
                document.getElementById('carousel-next').addEventListener('click', () => stepBy(1));

                // Drag pointer
                vp.addEventListener('pointerdown', e => {
                    isDrag = true; didDrag = false; isAuto = false;
                    dragSX = e.clientX; dragSPos = pos;
                    vp.setPointerCapture(e.pointerId);
                    track.style.transition = 'none';
                });
                vp.addEventListener('pointermove', e => {
                    if (!isDrag) return;
                    const dx = e.clientX - dragSX;
                    if (Math.abs(dx) > 5) didDrag = true;
                    pos = dragSPos + dx;
                    track.style.transform = `translateX(${pos}px)`;
                });
                vp.addEventListener('pointerup', e => {
                    if (!isDrag) return;
                    isDrag = false;
                    const dx = e.clientX - dragSX;
                    if (Math.abs(dx) > 40) pos = dragSPos - Math.sign(-dx) * ITEM_W();
                    reflow();
                    track.style.transition = 'transform .38s cubic-bezier(.25,.46,.45,.94)';
                    track.style.transform  = `translateX(${pos}px)`;
                    setTimeout(() => { track.style.transition = ''; isAuto = true; }, 400);
                });
                vp.addEventListener('pointercancel', () => {
                    isDrag = false; isAuto = true;
                    reflow();
                });

                // Bloque les clics si l'utilisateur a dragué
                vp.addEventListener('click', e => { if (didDrag) { e.preventDefault(); e.stopPropagation(); didDrag = false; } }, true);

                // Pause au survol (desktop)
                vp.addEventListener('mouseenter', () => { isAuto = false; });
                vp.addEventListener('mouseleave', () => { isAuto = true; });

                // Réinit si la taille change
                window.addEventListener('resize', () => {
                    clearTimeout(window._carouselResizeTimer);
                    window._carouselResizeTimer = setTimeout(init, 150);
                });

                init();
                loop();
            })();

            /* ── Recherche ──────────────────────────────────────────────── */
            const searchInput = document.getElementById('searchInput');
            const searchBtn   = document.getElementById('searchBtn');
            function doSearch() {
                const q = searchInput.value.trim(); if (!q) return;
                const isURL = /^(https?:\/\/|www\.)\S+/.test(q);
                window.open(isURL ? (q.startsWith('http') ? q : 'https://'+q) : `https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
                searchInput.value = '';
            }
            searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
            searchBtn.addEventListener('click', doSearch);

            /* ── Raccourcis utilisateur ─────────────────────────────────── */
            const addBtn          = document.getElementById('addShortcutBtn');
            const shortcutModal   = document.getElementById('shortcutModal');
            const shortcutClose   = document.getElementById('shortcutClose');
            const shortcutConfirm = document.getElementById('shortcutConfirm');
            const shortcutName    = document.getElementById('shortcutName');
            const shortcutUrl     = document.getElementById('shortcutUrl');
            const siteGrid        = document.getElementById('siteGrid');
            const MAX_SC = 7;

            function loadSC() { try { return JSON.parse(localStorage.getItem('pyramid_shortcuts') || '[]'); } catch { return []; } }
            function saveSC(a) { localStorage.setItem('pyramid_shortcuts', JSON.stringify(a)); }
            function refreshAddBtn() { addBtn.style.display = loadSC().length >= MAX_SC ? 'none' : 'flex'; }

            function renderShortcuts() {
                document.querySelectorAll('.user-shortcut').forEach(el => el.remove());
                loadSC().forEach((sc, i) => {
                    const a = document.createElement('a');
                    a.href = sc.url; a.target = '_blank'; a.rel = 'noopener';
                    a.className = 'user-shortcut w-14 h-14 md:w-[72px] md:h-[72px] rounded-xl bg-surface-container-low border border-outline-variant/20 hover:border-primary/60 hover:shadow-primary-glow cursor-pointer group card-hover no-underline flex flex-col items-center justify-center gap-1 p-2 relative';
                    const fav = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(sc.url)}`;
                    a.innerHTML = `
                        <button class="shortcut-menu-btn absolute -top-1 -right-1 w-5 h-5 rounded-full bg-surface-container border border-outline-variant/30 flex items-center justify-center opacity-0 transition-opacity z-10" data-index="${i}" aria-label="Options">
                            <svg class="w-3 h-3 text-on-surface-variant" fill="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
                        </button>
                        <div class="w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center overflow-hidden">
                            <img src="${fav}" class="w-5 h-5 object-contain" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                            <span style="display:none" class="w-full h-full items-center justify-center text-primary text-sm font-headline">${sc.name.charAt(0).toUpperCase()}</span>
                        </div>
                        <span class="text-[8px] font-label tracking-wide text-on-surface-variant group-hover:text-primary text-center leading-tight truncate w-full">${sc.name}</span>`;
                    siteGrid.insertBefore(a, addShortcutBtn);
                });
                refreshAddBtn();
                document.querySelectorAll('.shortcut-menu-btn').forEach(btn => {
                    btn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); showSCMenu(parseInt(btn.dataset.index), btn); });
                });
            }

            let ctxMenuIdx = null;
            function showSCMenu(index, trigger) {
                closeSCMenu();
                ctxMenuIdx = index;
                const sc = loadSC()[index]; if (!sc) return;
                const menu = document.createElement('div');
                menu.id = 'scMenu';
                menu.className = 'fixed z-[200] bg-surface-container-low border border-outline-variant/20 rounded-xl shadow-[0_8px_32px_rgba(0,0,0,0.4)] overflow-hidden';
                menu.innerHTML = `
                    <button id="scEdit" class="w-full px-4 py-2.5 text-left text-xs font-label text-on-surface hover:bg-primary/10 hover:text-primary flex items-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>Modifier
                    </button>
                    <button id="scDel" class="w-full px-4 py-2.5 text-left text-xs font-label text-red-400 hover:bg-red-500/10 flex items-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>Supprimer
                    </button>`;
                const r = trigger.getBoundingClientRect(), mw = 140;
                let left = r.right - mw; if (left < 10) left = 10;
                menu.style.cssText = `left:${left}px;top:${r.bottom+8}px;`;
                document.body.appendChild(menu);
                document.getElementById('scEdit').addEventListener('click', () => { editSC(index); closeSCMenu(); });
                document.getElementById('scDel').addEventListener('click', () => { const a = loadSC(); a.splice(index, 1); saveSC(a); renderShortcuts(); closeSCMenu(); });
                setTimeout(() => { document.addEventListener('click', closeSCMenuHandler); }, 100);
            }
            function closeSCMenuHandler(e) { const m = document.getElementById('scMenu'); if (m && !m.contains(e.target)) closeSCMenu(); }
            function closeSCMenu() { document.getElementById('scMenu')?.remove(); document.removeEventListener('click', closeSCMenuHandler); ctxMenuIdx = null; }

            function editSC(index) {
                const a = loadSC(), sc = a[index]; if (!sc) return;
                shortcutName.value = sc.name; shortcutUrl.value = sc.url.replace(/^https?:\/\//, '');
                document.getElementById('scModalTitle').textContent = 'Modifier le Raccourci';
                shortcutConfirm.textContent = 'Enregistrer';
                const orig = shortcutConfirm.onclick;
                shortcutConfirm.onclick = () => {
                    const name = shortcutName.value.trim(); let url = shortcutUrl.value.trim();
                    if (!name || !url) return;
                    if (!/^https?:\/\//.test(url)) url = 'https://' + url;
                    a[index] = { name, url }; saveSC(a); renderShortcuts(); closeModal(); shortcutConfirm.onclick = orig;
                };
                shortcutModal.classList.remove('hidden'); shortcutModal.classList.add('flex'); shortcutName.focus();
            }

            addBtn.addEventListener('click', () => {
                if (loadSC().length >= MAX_SC) { alert('Maximum de 7 raccourcis atteint.'); return; }
                shortcutModal.classList.remove('hidden'); shortcutModal.classList.add('flex'); shortcutName.focus();
            });
            function closeModal() {
                shortcutModal.classList.add('hidden'); shortcutModal.classList.remove('flex');
                shortcutName.value = ''; shortcutUrl.value = '';
                document.getElementById('scModalTitle').textContent = 'Nouveau Raccourci'; shortcutConfirm.textContent = 'Ajouter';
            }
            shortcutClose.addEventListener('click', closeModal);
            shortcutModal.addEventListener('click', e => { if (e.target === shortcutModal) closeModal(); });
            shortcutConfirm.addEventListener('click', () => {
                const name = shortcutName.value.trim(); let url = shortcutUrl.value.trim();
                if (!name || !url) return;
                if (!/^https?:\/\//.test(url)) url = 'https://' + url;
                const a = loadSC(); a.push({ name, url }); saveSC(a); renderShortcuts(); closeModal();
            });
            [shortcutName, shortcutUrl].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') shortcutConfirm.click(); }));
            renderShortcuts();
        });
    </script>

                    <a href="https://www.nexah.net/" target="_blank" rel="noopener" class="partner-item w-11 h-11 md:w-12 md:h-12 rounded-xl bg-white border border-outline-variant/20 hover:border-primary/60 hover:shadow-primary-glow card-hover no-underline flex items-center justify-center p-1 overflow-hidden" title="Nexah"><img src="https://www.google.com/s2/favicons?sz=128&domain=www.nexah.net" onerror="this.src='assets/logo/nexah.png';this.onerror=null;" class="w-full h-full object-contain" alt="Nexah"></a>
                </div>
            </section>

            <!-- ⑤ Raccourcis Utilisateur -->
            <section class="w-full max-w-5xl px-5">
                <div id="siteGrid" class="grid grid-cols-4 md:grid-cols-7 gap-2.5 md:gap-4 items-center justify-items-center">
                    <button id="addShortcutBtn"
                            class="sc-item w-14 h-14 md:w-[72px] md:h-[72px] rounded-xl bg-surface-container-low border-2 border-dashed border-primary/20 flex flex-col items-center justify-center gap-1 hover:bg-primary/5 hover:border-primary/60 group card-hover"
                            style="transition: background-color .2s, border-color .2s, box-shadow .2s">
                        <div class="w-7 h-7 rounded-xl bg-primary/10 flex items-center justify-center text-primary group-hover:scale-110" style="transition:transform .2s"><i class="fas fa-plus text-xs"></i></div>
                        <span class="text-[8px] font-headline tracking-widest uppercase text-primary/60">Ajouter</span>
                    </button>
                </div>
            </section>

        </div>
    </main>

    <!-- Bouton Personnaliser -->
    <div class="fixed bottom-5 right-5 z-40">
        <button id="customBtn" class="flex items-center gap-2 px-4 py-2.5 bg-surface-bright rounded-xl border border-outline-variant/15 hover:border-primary/40 hover:shadow-primary-glow glass-button group">
            <i class="fas fa-wand-magic-sparkles text-primary text-sm"></i>
            <span class="text-[10px] font-headline tracking-[.2em] uppercase text-on-surface-variant group-hover:text-primary">Personnaliser</span>
        </button>
    </div>

    <!-- Panneau Thèmes -->
    <div id="themePanel" class="fixed bottom-0 left-0 w-full bg-surface-container-low/90 backdrop-blur-xl border-t border-outline-variant/20 transform translate-y-full transition-transform duration-500 z-50">
        <div class="flex items-center justify-between px-8 py-4 border-b border-outline-variant/20">
            <span class="text-xs font-headline tracking-widest uppercase text-on-surface-variant">Choisis ton background</span>
            <button id="closePanel" class="w-8 h-8 flex items-center justify-center rounded-full bg-surface-container hover:bg-primary/10 border border-outline-variant/20 hover:border-primary/40 group">
                <i class="fas fa-times text-on-surface-variant group-hover:text-primary"></i>
            </button>
        </div>
        <div class="h-48 flex items-center px-8 overflow-x-auto gap-4 pb-4">
            <div class="theme-item min-w-[180px] h-24 rounded-xl overflow-hidden cursor-pointer border-2 border-outline-variant/20 hover:border-primary/40 transition relative flex-shrink-0" data-bg="none">
                <div class="w-full h-full flex items-center justify-center" style="background:linear-gradient(135deg,#121c17 0%,#0a0f0d 100%)"><svg class="w-10 h-10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1Z"/></svg></div>
                <div class="active-indicator absolute inset-0 border-2 border-primary opacity-0 transition-opacity"></div>
                <div class="absolute bottom-0 left-0 right-0 bg-black/60 px-2 py-1"><span class="text-[9px] font-headline uppercase text-white tracking-wider">Aucun</span></div>
            </div>
            <div class="theme-item min-w-[180px] h-24 rounded-xl overflow-hidden cursor-pointer border-2 border-outline-variant/20 hover:border-primary/40 transition relative flex-shrink-0" data-bg="assets/backgrounds/chutes-Lobé.jpg">
                <img src="assets/backgrounds/chutes-Lobé.jpg" alt="Chutes Lobé" class="w-full h-full object-cover">
                <div class="active-indicator absolute inset-0 border-2 border-primary opacity-0 transition-opacity"></div>
                <div class="absolute bottom-0 left-0 right-0 bg-black/60 px-2 py-1"><span class="text-[9px] font-headline uppercase text-white tracking-wider">Chutes Lobé</span></div>
            </div>
            <div class="theme-item min-w-[180px] h-24 rounded-xl overflow-hidden cursor-pointer border-2 border-outline-variant/20 hover:border-primary/40 transition relative flex-shrink-0" data-bg="assets/backgrounds/Chuttes ekom-nkam.jpg">
                <img src="assets/backgrounds/Chuttes ekom-nkam.jpg" alt="Chutes Ekom-Nkam" class="w-full h-full object-cover">
                <div class="active-indicator absolute inset-0 border-2 border-primary opacity-0 transition-opacity"></div>
                <div class="absolute bottom-0 left-0 right-0 bg-black/60 px-2 py-1"><span class="text-[9px] font-headline uppercase text-white tracking-wider">Chutes Ekom-Nkam</span></div>
            </div>
            <div class="theme-item min-w-[180px] h-24 rounded-xl overflow-hidden cursor-pointer border-2 border-outline-variant/20 hover:border-primary/40 transition relative flex-shrink-0" data-bg="assets/backgrounds/Mont-Cameroun.png">
                <img src="assets/backgrounds/Mont-Cameroun.png" alt="Mont Cameroun" class="w-full h-full object-cover">
                <div class="active-indicator absolute inset-0 border-2 border-primary opacity-0 transition-opacity"></div>
                <div class="absolute bottom-0 left-0 right-0 bg-black/60 px-2 py-1"><span class="text-[9px] font-headline uppercase text-white tracking-wider">Mont Cameroun</span></div>
            </div>
            <div class="theme-item min-w-[180px] h-24 rounded-xl overflow-hidden cursor-pointer border-2 border-outline-variant/20 hover:border-primary/40 transition relative flex-shrink-0" data-bg="assets/backgrounds/Monts Mandara.png">
                <img src="assets/backgrounds/Monts Mandara.png" alt="Monts Mandara" class="w-full h-full object-cover">
                <div class="active-indicator absolute inset-0 border-2 border-primary opacity-0 transition-opacity"></div>
                <div class="absolute bottom-0 left-0 right-0 bg-black/60 px-2 py-1"><span class="text-[9px] font-headline uppercase text-white tracking-wider">Monts Mandara</span></div>
            </div>
            <div class="theme-item min-w-[180px] h-24 rounded-xl overflow-hidden cursor-pointer border-2 border-outline-variant/20 hover:border-primary/40 transition relative flex-shrink-0" data-bg="assets/backgrounds/Parc de la Mefou.png">
                <img src="assets/backgrounds/Parc de la Mefou.png" alt="Parc de la Mefou" class="w-full h-full object-cover">
                <div class="active-indicator absolute inset-0 border-2 border-primary opacity-0 transition-opacity"></div>
                <div class="absolute bottom-0 left-0 right-0 bg-black/60 px-2 py-1"><span class="text-[9px] font-headline uppercase text-white tracking-wider">Parc de la Mefou</span></div>
            </div>
        </div>
    </div>

    <!-- Modal Raccourci -->
    <div id="shortcutModal" class="hidden fixed inset-0 z-[100] items-center justify-center bg-black/60 backdrop-blur-sm">
        <div class="bg-surface-container-low border border-outline-variant/20 rounded-2xl p-8 w-full max-w-sm mx-4 shadow-[0_32px_64px_rgba(0,16,8,0.5)]">
            <div class="flex items-center justify-between mb-6">
                <h2 id="scModalTitle" class="text-sm font-headline tracking-widest uppercase text-on-surface">Nouveau Raccourci</h2>
                <button id="shortcutClose" class="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant hover:text-primary hover:bg-primary/10 border border-outline-variant/20"><i class="fas fa-times text-xs"></i></button>
            </div>
            <div class="flex flex-col gap-4">
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-headline tracking-widest uppercase text-on-surface-variant">Nom</label>
                    <input id="shortcutName" type="text" placeholder="Ex: Douanes Cameroun" class="w-full bg-surface-container rounded-xl px-4 py-3 text-sm font-body text-on-surface placeholder-on-surface-variant/40 border border-outline-variant/20 focus:border-primary/50 focus:outline-none">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-[10px] font-headline tracking-widest uppercase text-on-surface-variant">URL</label>
                    <input id="shortcutUrl" type="text" placeholder="Ex: douanes.gov.cm" class="w-full bg-surface-container rounded-xl px-4 py-3 text-sm font-body text-on-surface placeholder-on-surface-variant/40 border border-outline-variant/20 focus:border-primary/50 focus:outline-none">
                </div>
                <button id="shortcutConfirm" class="mt-2 w-full py-3 rounded-xl bg-primary text-[#0a0f0d] text-xs font-headline tracking-widest uppercase hover:bg-primary-light font-semibold" style="transition:background-color .2s">Ajouter</button>
            </div>
        </div>
    </div>

    <!-- Arrière-plan -->
    <div class="fixed inset-0 pointer-events-none -z-10">
        <div id="solidBg" class="absolute inset-0 opacity-0 transition-opacity duration-500" style="background:linear-gradient(135deg,#0a0f0d 0%,#121c17 100%)">
            <div class="absolute top-0 right-0 w-[600px] h-[600px] bg-primary/25 rounded-full blur-[150px]"></div>
        </div>
        <img id="bgImage" alt="Thème" class="bg-image absolute inset-0 w-full h-full object-cover opacity-100" src="">
    </div>
